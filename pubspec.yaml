name: suwidhaa_ngo_dashboard
description: "Suwidhaa Unified Dashboard (NGO & School)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Icons ──
  cupertino_icons: ^1.0.8

  # ── State Management ──
  get: ^4.7.3

  # ── Networking & API ──
  dio: ^5.11.0

  # ── Local Storage ──
  shared_preferences: ^2.5.5

  # ── Date & Time ──
  intl: ^0.20.3

  # ── UI/UX (Toasts, Shimmer, Carousel) ──
  fluttertoast: ^8.2.12
  shimmer: ^3.0.0
  carousel_slider_plus: ^7.1.2

  # ── File Handling & Media ──
  file_picker: ^10.3.10
  image_picker: ^1.2.4

  # ── Video Players (OTT / Classes ke liye) ──
  video_player: ^2.11.1
  chewie: ^1.7.1
#  youtube_explode_dart: ^2.3.1
  youtube_player_iframe: ^6.0.2 # Recommended version for YouTube

  # ── Utilities ──
  url_launcher: ^6.3.2

  # ── Firebase (If needed in future) ──
  firebase_core: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/logo/
